name: Sonda votação munzona (candidato e partido)
on:
  workflow_dispatch:
  push:
    paths: ['scripts/sonda_vot.py', '.github/workflows/sonda-vot.yml']
permissions:
  contents: write
jobs:
  sonda:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Baixar e sondar
        run: |
          mkdir -p /tmp/tse
          B=https://cdn.tse.jus.br/estatistica/sead/odsele
          {
          for a in 2026 2022; do for u in votacao_candidato_munzona/votacao_candidato_munzona_$a votacao_partido_munzona/votacao_partido_munzona_$a consulta_cand/consulta_cand_$a; do
            echo "== $u"; curl -sS -I -L --http1.1 -m 30 "$B/$u.zip" 2>&1 | grep -iE "^HTTP|content-length|last-modified" | tr '\r\n' '  '; echo
            curl -sS -f -L --http1.1 --retry 5 --retry-all-errors -o /tmp/tse/$(basename $u).zip "$B/$u.zip" || echo "FALHOU $u"
          done; done
          ls -la /tmp/tse
          python3 scripts/sonda_vot.py /tmp/tse/votacao_candidato_munzona_2026.zip /tmp/tse/votacao_partido_munzona_2026.zip /tmp/tse/votacao_candidato_munzona_2022.zip /tmp/tse/votacao_partido_munzona_2022.zip
          } 2>&1 | tee sonda_vot.log
      - name: Publicar log
        run: |
          git config user.name "coletor"; git config user.email "coletor@users.noreply.github.com"
          git checkout --orphan sonda-v; git rm -rf -q . 2>/dev/null; git add -f sonda_vot.log; git commit -q -m "log sonda_vot"; git push -f origin HEAD:sonda-vot
