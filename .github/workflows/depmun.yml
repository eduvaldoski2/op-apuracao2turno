name: Votos dos deputados por município (1º turno)
on:
  workflow_dispatch:
    inputs:
      uf: { description: 'só um estado (ex.: ac); vazio = todos', required: false, default: '' }
permissions:
  contents: write
jobs:
  depmun:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: node scripts/depmun.mjs data/dep_mun --amostra ${{ github.event.inputs.uf && format('--uf={0}', github.event.inputs.uf) || '' }} > depmun.log 2>&1; echo "exit $?" >> depmun.log; tail -60 depmun.log
      - name: Publicar
        if: always()
        run: |
          git config user.name coletor; git config user.email coletor@users.noreply.github.com
          git add data/dep_mun && git commit -q -m "Votos dos deputados por município (TSE)" && git pull -q --rebase origin main && git push || echo "sem dados para publicar" >> depmun.log
      - name: Log para conferência
        if: always()
        run: |
          cp depmun.log "$RUNNER_TEMP/" ; git fetch -q origin; git checkout -q --orphan depmun-log; git rm -rfq . >/dev/null 2>&1 || true
          cp "$RUNNER_TEMP/depmun.log" . && git add depmun.log && git commit -qm log && git push -f origin depmun-log
