name: Votação proporcional por UF (TSE votacao_*_munzona)
on:
  workflow_dispatch:
  push:
    paths: ['scripts/build_votos.py', '.github/workflows/votos.yml']
permissions:
  contents: write
jobs:
  votos:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Baixar e agregar
        run: |
          mkdir -p /tmp/tse
          B=https://cdn.tse.jus.br/estatistica/sead/odsele
          for ANO in 2026 2022; do
            for u in votacao_candidato_munzona/votacao_candidato_munzona_$ANO votacao_partido_munzona/votacao_partido_munzona_$ANO; do
              curl -sS -f -L --http1.1 --retry 5 --retry-all-errors -o /tmp/tse/$(basename $u).zip "$B/$u.zip"
            done
            python3 scripts/build_votos.py $ANO /tmp/tse data/vot 2>&1 | tee -a votos.log
            rm -f /tmp/tse/*.zip
          done
          du -sh data/vot/*
      - name: Publicar
        run: |
          git config user.name "coletor"; git config user.email "coletor@users.noreply.github.com"
          git add data/vot && git commit -q -m "Votação proporcional 2026 e 2022 por UF (TSE munzona agregado)" && git pull -q --rebase origin main && git push || echo "FALHA AO PUBLICAR" >> votos.log
          git checkout --orphan sonda-v; git rm -rf -q . 2>/dev/null; git add -f votos.log; git commit -q -m "log votos"; git push -f origin HEAD:sonda-vot
