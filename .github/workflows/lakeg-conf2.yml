name: Lake gerais - classificar divergencias da conferencia 2
on:
  workflow_dispatch:
    inputs:
      ano: { description: 'Ano', required: true, default: '2016' }
permissions:
  contents: write
jobs:
  analisa:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q duckdb==1.1.3
      - name: Baixar e analisar
        env: { GH_TOKEN: '${{ secrets.GITHUB_TOKEN }}' }
        run: |
          A=${{ github.event.inputs.ano }}; mkdir -p /tmp/d
          gh release download lake-$A -R ${{ github.repository }} -D /tmp/d -p "secao_${A}_*.parquet" -p "zona_${A}.parquet" -p "candidato_${A}.parquet"
          python3 scripts/lake_gerais/analisa_conf2.py $A /tmp/d 2>&1 | tee /tmp/conf2.log
      - name: Publicar log
        if: always()
        run: |
          rm -rf /tmp/pub && mkdir /tmp/pub && cd /tmp/pub && cp /tmp/conf2.log . ; git init -q -b lakeg-conf2-${{ github.event.inputs.ano }} && git config user.name coletor && git config user.email coletor@users.noreply.github.com && git add . && git commit -q -m log
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" lakeg-conf2-${{ github.event.inputs.ano }}
