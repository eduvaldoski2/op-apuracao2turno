name: Cadastro de candidaturas (TSE consulta_cand + complementar + bens + cassação)
on:
  workflow_dispatch:
  push:
    paths: ['scripts/build_cand.py', '.github/workflows/cand.yml']
permissions:
  contents: write
jobs:
  cand:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANO: '2026'
    steps:
      - uses: actions/checkout@v4
      - name: Baixar e montar
        run: |
          mkdir -p /tmp/tse
          B=https://cdn.tse.jus.br/estatistica/sead/odsele
          for u in consulta_cand/consulta_cand_$ANO consulta_cand_complementar/consulta_cand_complementar_$ANO bem_candidato/bem_candidato_$ANO motivo_cassacao/motivo_cassacao_$ANO; do
            curl -sS -f -L --http1.1 --retry 5 --retry-all-errors -o /tmp/tse/$(basename $u).zip "$B/$u.zip"
          done
          ls -la /tmp/tse
          python3 scripts/build_cand.py $ANO /tmp/tse data/cand . 2>&1 | tee cand.log
          du -sh data/cand/$ANO; ls data/cand/$ANO | head -40
      - name: Publicar
        run: |
          git config user.name "coletor"; git config user.email "coletor@users.noreply.github.com"
          git add data/cand && git commit -q -m "Cadastro de candidaturas $ANO (TSE): consulta_cand + complementar + bens + cassação" && git pull -q --rebase origin main && git push || echo "FALHA AO PUBLICAR" >> cand.log
          git checkout --orphan sonda-c; git rm -rf -q . 2>/dev/null; git add -f cand.log; git commit -q -m "log cand"; git push -f origin HEAD:sonda-cand
