name: Regiões do estado (IBGE)
on: { workflow_dispatch: {} }
permissions: { contents: write }
jobs:
  r:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: mkdir -p data/regioes_uf && (node scripts/regioes_ibge.mjs 2>&1 | tee data/regioes_uf/log.txt) || true
      - run: |
          git config user.name coletor; git config user.email coletor@users.noreply.github.com
          git add -f data/regioes_uf && git commit -q -m "Regiões intermediárias do IBGE por estado" && git pull -q --rebase origin main && git push
