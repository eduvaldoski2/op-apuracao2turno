name: Vigia das edições do Radar
# Alerta quando uma edição (7h, 11h, 15h, 19h) não está na main 40 min depois da hora: abre um issue (o GitHub avisa por e-mail).
on:
  schedule:
    - cron: '40 10,14,18,22 * * *'      # 07h40, 11h40, 15h40, 19h40 (Brasília)
  workflow_dispatch: {}
permissions: { contents: read, issues: write }
jobs:
  vigia:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { sparse-checkout: 'radar/arquivo', sparse-checkout-cone-mode: false }
      - name: Conferir edição
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          H=$(TZ=America/Sao_Paulo date +%H); D=$(TZ=America/Sao_Paulo date +%F)
          # a hora da edição é a mais recente entre 07, 11, 15, 19 que já passou
          for E in 19 15 11 07; do if [ "$H" -ge "$E" ]; then ED=$E; break; fi; done
          [ -z "$ED" ] && exit 0
          if [ -f "radar/arquivo/$D-${ED}h.php" ]; then echo "edição ${ED}h presente"; exit 0; fi
          T="Edição das ${ED}h de $D não foi publicada"
          if gh issue list --state open --search "$T in:title" --json number -q '.[0].number' | grep -q .; then exit 0; fi
          gh issue create --title "$T" --body "A edição ${ED}h do Radar não está em radar/arquivo na main $(date -u +%H:%M) UTC. As rotinas agendadas (principal e reserva) não publicaram. Rode a rotina Radar OP da edição ${ED}h manualmente ou peça a edição ao Claude." || true
