name: Lake gerais - construir ano (TSE por seção -> Parquet -> Release)
on:
  workflow_dispatch:
    inputs:
      ano: { description: 'Ano', required: false, default: '2026' }
      ufs: { description: 'Restringir UFs (ex.: AC,RJ) - vazio = todas', required: false, default: '' }
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q duckdb==1.1.3
      - name: Construir
        run: |
          set -o pipefail
          A=${{ github.event.inputs.ano || '2026' }}; U="${{ github.event.inputs.ufs }}"
          mkdir -p /tmp/lake
          python3 scripts/lake_gerais/build_lake.py $A /tmp/lake ${U:+--ufs=$U} 2>&1 | tee /tmp/lake/build.log
      - name: Publicar release
        env: { GH_TOKEN: '${{ secrets.GITHUB_TOKEN }}' }
        run: |
          A=${{ github.event.inputs.ano || '2026' }}; T=lake-$A
          gh release view $T >/dev/null 2>&1 || gh release create $T --title "Lake eleitoral $A (TSE, por secao, Parquet)" --notes "Arquivos Parquet gerados por scripts/lake_gerais/build_lake.py a partir dos dados abertos do TSE. Ver conferencia.md e manifesto.json."
          cd /tmp/lake && gh release upload -R ${{ github.repository }} $T *.parquet conferencia.md manifesto.json --clobber
      - name: Publicar log
        if: always()
        run: |
          rm -rf /tmp/pub && mkdir /tmp/pub && cd /tmp/pub
          for f in build.log conferencia.md manifesto.json; do [ -f /tmp/lake/$f ] && cp /tmp/lake/$f . ; done
          ls -la /tmp/lake | head -40 > ls.txt; echo "run ${{ github.run_id }}" > run.txt
          git init -q -b lakeg-log && git config user.name coletor && git config user.email coletor@users.noreply.github.com && git add . && git commit -q -m log
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" lakeg-log
