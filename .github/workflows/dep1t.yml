name: Resultado oficial do 1º turno para deputados (federal e estadual, por estado)
on:
  workflow_dispatch:
  push:
    paths: ['scripts/dep1t.mjs', '.github/workflows/dep1t.yml', 'js/tse.js']
permissions:
  contents: write
jobs:
  dep:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: node scripts/dep1t.mjs data/dep_1t --amostra 2>&1 | tee dep1t.log
      - name: Publicar
        run: |
          git config user.name coletor; git config user.email coletor@users.noreply.github.com
          git add data/dep_1t && git commit -q -m "Resultado oficial do 1º turno para deputados (TSE)" && git pull -q --rebase origin main && git push || echo FALHA >> dep1t.log
      - name: Log para conferência
        if: always()
        run: |
          git fetch -q origin; git checkout -q --orphan dep-log; git rm -rfq . >/dev/null 2>&1 || true
          cp ../dep1t.log . 2>/dev/null || cp "$GITHUB_WORKSPACE/dep1t.log" . 2>/dev/null || true
          git add dep1t.log && git commit -qm log && git push -f origin dep-log
