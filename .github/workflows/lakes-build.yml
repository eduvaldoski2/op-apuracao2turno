name: Lake suplementares - construir conjunto (BU na Web -> Parquet -> Release)
on:
  workflow_dispatch:
    inputs:
      ano: { description: 'Conjunto (2024, 2022 ou 2020)', required: false, default: '2024' }
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q duckdb==1.1.3
      - name: Construir
        run: |
          set -o pipefail
          A=${{ github.event.inputs.ano || '2024' }}
          mkdir -p /tmp/lake
          python3 scripts/lake_supl/build_supl.py $A /tmp/lake 2>&1 | tee /tmp/lake/build.log
      - name: Publicar release
        env: { GH_TOKEN: '${{ secrets.GITHUB_TOKEN }}' }
        run: |
          A=${{ github.event.inputs.ano || '2024' }}; T=lake-sup-$A
          gh release view $T >/dev/null 2>&1 || gh release create $T --title "Lake eleicoes suplementares (conjunto $A, TSE BU na Web, Parquet)" --notes "Gerado por scripts/lake_supl/build_supl.py. Ver conferencia.md e manifesto.json."
          cd /tmp/lake && gh release upload -R ${{ github.repository }} $T *.parquet conferencia.md manifesto.json --clobber
      - name: Publicar log
        if: always()
        run: |
          rm -rf /tmp/pub && mkdir /tmp/pub && cd /tmp/pub
          for f in build.log conferencia.md manifesto.json; do [ -f /tmp/lake/$f ] && cp /tmp/lake/$f . ; done
          echo "run ${{ github.run_id }} conjunto ${{ github.event.inputs.ano }}" > run.txt
          git init -q -b lakes-log-${{ github.event.inputs.ano || '2024' }} && git config user.name coletor && git config user.email coletor@users.noreply.github.com && git add . && git commit -q -m log
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" lakes-log-${{ github.event.inputs.ano || '2024' }}
