name: Candidatos - sonda das listas do TSE (consulta_cand)
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sonda:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with: { sparse-checkout: scripts/lake_cand }
      - name: Sondar
        run: |
          exec > >(tee /tmp/sonda.log) 2>&1
          python3 scripts/lake_cand/sonda_cand.py 2026 2024 2022 2020 2018 2016 2014 2012 2010 2008 2006 2004 2002 2000 1998 1996 1994
      - name: Publicar log
        if: always()
        run: |
          rm -rf /tmp/pub && mkdir /tmp/pub && cd /tmp/pub && cp /tmp/sonda.log . && git init -q -b cand-log && git config user.name coletor && git config user.email coletor@users.noreply.github.com && git add . && git commit -q -m log && git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" cand-log
