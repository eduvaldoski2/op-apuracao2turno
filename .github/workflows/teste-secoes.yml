name: Teste da coleta por seção (1º turno como ensaio)
on:
  workflow_dispatch:
  push:
    paths: ['scripts/bu.mjs', 'scripts/ber.mjs', 'scripts/secoes.mjs', 'scripts/valida_secoes.mjs', '.github/workflows/teste-secoes.yml']
permissions:
  contents: write
jobs:
  teste:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Coletar AC e RR (1º turno, eleição 6257 / pleito 3220)
        run: |
          start=$SECONDS
          node scripts/secoes.mjs --out /tmp/c --ufs ac,rr --pleito 3220 --ele 6257 --max-tarefas 20000 2>&1 | tee teste.log
          echo "tempo $((SECONDS-start)) s" | tee -a teste.log
          for u in ac rr; do node scripts/valida_secoes.mjs /tmp/c/bairros data/bairros $u 2>&1 | tee -a teste.log; done
          du -sh /tmp/c/bairros | tee -a teste.log
      - name: Publicar log
        run: |
          git config user.name t; git config user.email t@users.noreply.github.com
          git checkout --orphan sonda-t; git rm -rf -q . 2>/dev/null; git add -f teste.log; git commit -q -m log; git push -f origin HEAD:sonda
