name: Lake gerais - sonda (locais de votacao)
on:
  workflow_dispatch:
    inputs:
      ano: { description: 'Ano', required: false, default: '2022' }
permissions:
  contents: write
jobs:
  sonda:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Locais
        run: |
          exec > >(tee /tmp/sonda.log) 2>&1
          B=https://cdn.tse.jus.br/estatistica/sead/odsele; A=${{ github.event.inputs.ano || '2022' }}
          mkdir -p /tmp/t && cd /tmp/t
          for u in eleitorado_locais_votacao/eleitorado_local_votacao_$A eleitorado_local_votacao/eleitorado_local_votacao_$A; do
            echo "== $u"; curl -sSI -L --http1.1 "$B/$u.zip" | egrep -i "^HTTP|content-length" | tr -d '\r' | tr '\n' ' '; echo
            if curl -sS -f -L --http1.1 -o x.zip "$B/$u.zip"; then unzip -Z1 x.zip | head -40 | tr '\n' ' '; echo; f=$(unzip -Z1 x.zip | grep -i csv | head -1); echo "-- $f"; unzip -p x.zip "$f" | head -3 | iconv -f latin1 -t utf8; fi
          done
      - name: Publicar log
        if: always()
        run: |
          rm -rf /tmp/pub && mkdir /tmp/pub && cd /tmp/pub && cp /tmp/sonda.log . && git init -q -b sonda-lakeg && git config user.name coletor && git config user.email coletor@users.noreply.github.com && git add . && git commit -q -m log && git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" sonda-lakeg
