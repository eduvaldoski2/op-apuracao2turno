name: Malhas de bairros (IBGE Censo 2022) ligadas aos locais de votação
on:
  workflow_dispatch:
  push:
    paths: ['scripts/build_geo_bairros.py', '.github/workflows/geobairros.yml', 'data/fontes/**']
permissions:
  contents: write
jobs:
  geo:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - run: pip install pyshp shapely 2>&1 | tail -1
      - name: Baixar shapefiles por UF
        run: |
          mkdir -p /tmp/shp; G=https://geoftp.ibge.gov.br/organizacao_do_territorio/malhas_territoriais/malhas_de_setores_censitarios__divisoes_intramunicipais/censo_2022/bairros/shp/UF
          for u in AC AL AM AP BA CE ES GO MA MG MS MT PA PB PE PI PR RJ RN RO RR RS SC SE SP; do curl -sS -f -m 120 -o /tmp/shp/${u}_bairros_CD2022.zip "$G/${u}_bairros_CD2022.zip" || echo "falhou $u"; done; ls /tmp/shp | wc -l
      - name: Montar
        run: python3 scripts/build_geo_bairros.py /tmp/shp data/bairros data/base_1t.json data/bairros_geo 2>&1 | tee geo.log; du -sh data/bairros_geo | tee -a geo.log; ls data/bairros_geo | wc -l | tee -a geo.log
      - name: Publicar
        run: |
          git config user.name coletor; git config user.email coletor@users.noreply.github.com
          git add data/bairros_geo && git commit -q -m "Malhas de bairros (IBGE 2022) por município" && git pull -q --rebase origin main && git push || echo FALHA >> geo.log
          git checkout --orphan sonda-g; git rm -rf -q . 2>/dev/null; git add -f geo.log; git commit -q -m log; git push -f origin HEAD:sonda
