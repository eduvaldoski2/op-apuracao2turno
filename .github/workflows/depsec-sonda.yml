name: Sonda votação por seção de deputados (dados abertos TSE)
on:
  workflow_dispatch:
    inputs:
      uf: { description: 'UF em maiúsculas', required: false, default: 'RR' }
permissions:
  contents: write
jobs:
  sonda:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - name: Baixar e inspecionar
        run: |
          UF=${{ github.event.inputs.uf || 'RR' }}
          B=https://cdn.tse.jus.br/estatistica/sead/odsele/votacao_secao
          mkdir -p /tmp/s; (
          for U in "$B/votacao_secao_2026_$UF.zip"; do
            echo "== $U"; curl -sS -I -L --http1.1 "$U" | head -12
            curl -sS -f -L --http1.1 --retry 4 --retry-all-errors -o /tmp/s/v.zip "$U" && ls -l /tmp/s/v.zip && unzip -l /tmp/s/v.zip
            f=$(unzip -Z1 /tmp/s/v.zip | grep -i csv | head -1); echo "arquivo: $f"
            unzip -p /tmp/s/v.zip "$f" | iconv -f latin1 -t utf8 | head -3
            echo "--- cargos"; unzip -p /tmp/s/v.zip "$f" | iconv -f latin1 -t utf8 | cut -d';' -f1-30 | awk -F';' 'NR>1{print $15";"$16}' | sort | uniq -c | head
          done ) > sonda.log 2>&1; tail -40 sonda.log
      - name: Log
        if: always()
        run: |
          cp sonda.log "$RUNNER_TEMP/"; git config user.name coletor; git config user.email c@users.noreply.github.com
          git fetch -q origin; git checkout -q --orphan depsec-log; git rm -rfq . >/dev/null 2>&1 || true
          cp "$RUNNER_TEMP/sonda.log" . && git add sonda.log && git commit -qm log && git push -f origin depsec-log
