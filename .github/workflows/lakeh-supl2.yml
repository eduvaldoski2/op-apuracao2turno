name: Lake historico - amostra dos arquivos das eleicoes suplementares
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sonda:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Amostra
        run: |
          exec > >(tee /tmp/supl2.log) 2>&1
          B=https://cdn.tse.jus.br/estatistica/sead/eleicoes
          for A in 2024 2022 2020; do
            rm -rf /tmp/s && mkdir -p /tmp/s && cd /tmp/s && curl -sS -f -L --retry 3 -o x.zip "$B/eleicoes$A/buweb/buweb_ele_suplementares_$A.zip" && unzip -o -q x.zip
            d=$(ls -d 20*/ | head -1); echo "######## $A primeira data $d"; ls -la "$d"
            for z in $d*.zip; do echo "== $z"; unzip -Z1 "$z" | head -20; n=$(unzip -Z1 "$z" | head -1); unzip -o -q "$z" -d u; for g in $(ls u | head -2); do echo "-- $g linhas: $(wc -l < u/$g)"; iconv -f latin1 -t utf8 "u/$g" | head -4 | cut -c1-700; done; done
            for z in $(ls -d 20*/ | head -3); do ls "$z" | head -5; done
            cd /
          done
      - name: Publicar log
        if: always()
        run: |
          rm -rf /tmp/pub && mkdir /tmp/pub && cd /tmp/pub && cp /tmp/supl2.log . && git init -q -b sonda-supl2 && git config user.name coletor && git config user.email coletor@users.noreply.github.com
          git add -A && git commit -q -m "amostra suplementares" && git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" sonda-supl2
