name: Coletor por seção (bairros) — 2º turno
# Lê o boletim de urna das seções totalizadas (TSE) e publica o resultado por seção, por município,
# em branches separadas por grupo de estados (dados-b1 … dados-b5). O painel junta com data/bairros.
on:
  workflow_dispatch:
    inputs:
      forcar: { description: 'Rodar fora de 25–26/10/2026 (ensaio)', required: false, default: 'nao' }
      pleito: { description: 'Pleito TSE (3221 = 2º turno; 3220 = ensaio com o 1º turno)', required: false, default: '3221' }
      ele: { description: 'Eleição TSE (6258 = 2º turno; 6257 = ensaio)', required: false, default: '6258' }
      prefixo: { description: 'Prefixo das branches (dados-b = produção; ensaio-b = testes)', required: false, default: 'dados-b' }
      minutos: { description: 'Duração do laço (min)', required: false, default: '350' }
      ufs: { description: 'Restringir a estes estados (ex.: ac,rr); vazio = todos', required: false, default: '' }
  schedule:
    - cron: '*/10 * * * *'
permissions:
  contents: write
jobs:
  secoes:
    strategy:
      fail-fast: false
      matrix:
        g: [1, 2, 3, 4, 5]
    runs-on: ubuntu-latest
    timeout-minutes: 355
    concurrency:
      group: secoes-${{ matrix.g }}-${{ github.event.inputs.prefixo || 'dados-b' }}
      cancel-in-progress: false
    steps:
      - name: Janela de execução
        id: janela
        run: |
          hoje=$(date -u +%Y-%m-%d)
          if [ "${{ github.event.inputs.forcar }}" = "sim" ] || [ "$hoje" = "2026-10-25" ] || [ "$hoje" = "2026-10-26" ]; then echo "rodar=sim" >> "$GITHUB_OUTPUT"; else echo "rodar=nao" >> "$GITHUB_OUTPUT"; fi
          case "${{ matrix.g }}" in
            1) echo "ufs=sp" >> "$GITHUB_OUTPUT";;
            2) echo "ufs=mg,pa,pi,am,df" >> "$GITHUB_OUTPUT";;
            3) echo "ufs=rj,pe,sc,mt,ms,ro,zz,rr" >> "$GITHUB_OUTPUT";;
            4) echo "ufs=ba,ce,go,es,al,to,ac" >> "$GITHUB_OUTPUT";;
            5) echo "ufs=rs,pr,ma,pb,rn,se,ap" >> "$GITHUB_OUTPUT";;
          esac
      - uses: actions/checkout@v4
        if: steps.janela.outputs.rodar == 'sim'
      - uses: actions/setup-node@v4
        if: steps.janela.outputs.rodar == 'sim'
        with: { node-version: '22' }
      - name: Preparar branch
        if: steps.janela.outputs.rodar == 'sim'
        run: |
          RAMO="${{ github.event.inputs.prefixo || 'dados-b' }}${{ matrix.g }}"
          if git ls-remote --exit-code --heads origin "$RAMO" >/dev/null 2>&1; then
            git fetch --depth=1 origin "$RAMO" && git worktree add dados FETCH_HEAD && (cd dados && git checkout -B "$RAMO")
          else
            mkdir dados && cd dados && git init -q -b "$RAMO" && git remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" && cd ..
          fi
          cd dados && git config user.name "coletor" && git config user.email "coletor@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" || true
      - name: Coletar (laço)
        if: steps.janela.outputs.rodar == 'sim'
        run: |
          RAMO="${{ github.event.inputs.prefixo || 'dados-b' }}${{ matrix.g }}"
          PLEITO="${{ github.event.inputs.pleito || '3221' }}"; ELE="${{ github.event.inputs.ele || '6258' }}"; MIN="${{ github.event.inputs.minutos || '350' }}"
          UFS="${{ github.event.inputs.ufs }}"; [ -z "$UFS" ] && UFS="${{ steps.janela.outputs.ufs }}"
          fim=$((SECONDS+MIN*60))
          while [ $SECONDS -lt $fim ]; do
            node scripts/secoes.mjs --out dados/live --ufs "$UFS" --pleito "$PLEITO" --ele "$ELE" --max-tarefas 2500 --rps 70 || true
            (cd dados && git add -A && if ! git diff --cached --quiet; then git commit -q --amend -m "dados" 2>/dev/null || git commit -q -m "dados"; git push -q -f origin "$RAMO" || true; fi)
            sleep 5
          done
