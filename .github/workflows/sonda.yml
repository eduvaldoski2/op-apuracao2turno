name: Sondagem de fontes (bairros)
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/sonda.yml', 'scripts/sonda*', 'scripts/ber.mjs']
permissions:
  contents: write
jobs:
  sonda:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/sonda2.sh > sonda.txt 2>&1 || true
      - name: Publicar resultado
        run: |
          git config user.name sonda; git config user.email sonda@users.noreply.github.com
          git checkout --orphan sonda; git rm -rf -q . ; git checkout HEAD -- 2>/dev/null || true
          mkdir -p out; git add -f sonda.txt out; git commit -q -m "sonda"; git push -f origin HEAD:sonda
