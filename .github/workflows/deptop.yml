name: Mais votados por local de votação (1º turno)
on:
  workflow_dispatch:
    inputs:
      ufs: { description: 'UFs separadas por espaço (ex.: RR AC); vazio = todas', required: false, default: '' }
permissions:
  contents: write
jobs:
  lista:
    runs-on: ubuntu-latest
    outputs: { ufs: '${{ steps.l.outputs.ufs }}' }
    steps:
      - id: l
        run: |
          T="${{ github.event.inputs.ufs }}"; [ -z "$T" ] && T="AC AL AM AP BA CE DF ES GO MA MG MS MT PA PB PE PI PR RJ RN RO RR RS SC SE SP TO"
          echo "ufs=$(printf '%s\n' $T | jq -R . | jq -sc .)" >> "$GITHUB_OUTPUT"
  secao:
    needs: lista
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: { uf: '${{ fromJson(needs.lista.outputs.ufs) }}' }
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Baixar e processar
        run: |
          UF=${{ matrix.uf }}; lc=$(echo $UF | tr A-Z a-z)
          curl -sS -f -L --http1.1 --retry 5 --retry-all-errors -o /tmp/v.zip https://cdn.tse.jus.br/estatistica/sead/odsele/votacao_secao/votacao_secao_2026_$UF.zip
          node --max-old-space-size=6000 scripts/deptop.mjs /tmp/v.zip data/dep_top $lc 2>&1 | tee deptop_$lc.log
          du -sh data/dep_top | tee -a deptop_$lc.log
      - name: Publicar
        run: |
          lc=$(echo ${{ matrix.uf }} | tr A-Z a-z)
          git config user.name coletor; git config user.email coletor@users.noreply.github.com
          git add data/dep_top && git commit -q -m "Mais votados por local: $lc (TSE)"
          for i in 1 2 3 4 5 6 7 8; do git pull -q --rebase origin main && git push -q && break; sleep $((RANDOM%10+3)); done
          cp deptop_$lc.log "$RUNNER_TEMP/" 
      - name: Log
        if: always()
        run: |
          lc=$(echo ${{ matrix.uf }} | tr A-Z a-z); cp deptop_$lc.log "$RUNNER_TEMP/" 2>/dev/null || true
          git fetch -q origin; git checkout -q -B deptop-log-$lc; git rm -rfq . >/dev/null 2>&1 || true
          cp "$RUNNER_TEMP/deptop_$lc.log" . 2>/dev/null; git add . ; git commit -qm log; git push -f origin deptop-log-$lc
