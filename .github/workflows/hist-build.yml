name: Histórico - camada do painel até a seção (lake -> JSON -> branch hist-<ano>)
on:
  workflow_dispatch:
    inputs:
      ano: { description: 'Ano', required: true, default: '2022' }
      ufs: { description: 'Restringir UFs (ex.: AC,RJ) - vazio = todas', required: false, default: '' }
      el: { description: 'Restringir eleições (ex.: c3t1,c6t1) - vazio = todas', required: false, default: '' }
      limpar: { description: 'Recriar o branch do zero (só em execução completa)', required: false, default: 'nao' }
permissions: { contents: write }
concurrency: { group: 'hist-${{ github.event.inputs.ano }}', cancel-in-progress: false }
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with: { sparse-checkout: "scripts/hist\ndata/bairros_geo\ndata/regioes", sparse-checkout-cone-mode: false }
      - run: pip install -q duckdb==1.1.3 shapely==2.0.6
      - name: Baixar o lake do ano
        env: { GH_TOKEN: '${{ secrets.GITHUB_TOKEN }}' }
        run: |
          mkdir -p /tmp/lake && cd /tmp/lake
          gh release download lake-${{ github.event.inputs.ano }} -R ${{ github.repository }} -p '*.parquet'
          ls -la | head -50
      - name: Branch de destino
        run: |
          A=${{ github.event.inputs.ano }}; R="https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          if [ "${{ github.event.inputs.limpar }}" = "sim" ] || ! git ls-remote --exit-code --heads "$R" hist-$A >/dev/null; then
            mkdir -p /tmp/out && cd /tmp/out && git init -q -b hist-$A && git remote add origin "$R"
          else
            git clone -q --depth 1 -b hist-$A "$R" /tmp/out
          fi
      - name: Construir
        run: |
          set -o pipefail
          U="${{ github.event.inputs.ufs }}"; E="${{ github.event.inputs.el }}"
          REPO_DIR=$GITHUB_WORKSPACE python3 scripts/hist/build_hist.py ${{ github.event.inputs.ano }} /tmp/lake /tmp/out ${U:+--ufs=$U} ${E:+--el=$E} 2>&1 | tee /tmp/build.log
          du -sh /tmp/out; find /tmp/out -type f -not -path '*/.git/*' | wc -l
      - name: Publicar
        run: |
          cd /tmp/out && cp /tmp/build.log _build.log && git config user.name coletor && git config user.email coletor@users.noreply.github.com
          git add -A && git commit -q -m "Histórico ${{ github.event.inputs.ano }} ${{ github.event.inputs.ufs }} ${{ github.event.inputs.el }}" && git push -q -f origin HEAD:hist-${{ github.event.inputs.ano }}
