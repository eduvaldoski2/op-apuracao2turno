name: Resultado oficial do 1º turno para governador (por estado)
on:
  workflow_dispatch:
  push:
    paths: ['scripts/gov1t.mjs', '.github/workflows/gov1t.yml', 'js/tse.js']
permissions:
  contents: write
jobs:
  gov:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: node scripts/gov1t.mjs data/gov_1t.json 2>&1 | tee gov1t.log
      - name: Publicar
        run: |
          git config user.name coletor; git config user.email coletor@users.noreply.github.com
          git add data/gov_1t.json && git commit -q -m "Resultado oficial do 1º turno para governador (TSE)" && git pull -q --rebase origin main && git push || echo FALHA >> gov1t.log
