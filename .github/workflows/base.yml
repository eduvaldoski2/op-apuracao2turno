name: Montar base do 1º turno (por município)
# Lê o resultado FINAL do 1º turno (eleição 6257) de cada município nos arquivos do TSE e grava data/base_1t.json.
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  base:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: node scripts/coletor.mjs --base data/base_1t.json
      - name: Conferir
        run: node -e "const j=JSON.parse(require('fs').readFileSync('data/base_1t.json','utf8'));const s=k=>j.rows.reduce((a,r)=>a+r[k],0);console.log('linhas',j.rows.length,'Lula',s(10),'Flavio',s(11),'eleitorado',s(5));"
      - name: Publicar
        run: |
          git config user.name "coletor"; git config user.email "coletor@users.noreply.github.com"
          git add data/base_1t.json && git commit -m "Base do 1º turno por município (TSE)" && git push
