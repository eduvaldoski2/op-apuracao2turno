<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#3E347E">
<title>Radar da Oficina Política · Entrar</title>
<link rel="icon" type="image/svg+xml" href="/img/favicon.svg?v=5">
<link rel="apple-touch-icon" href="/img/apple-touch-icon.png?v=5">
<link rel="stylesheet" href="/css/app.css">
<link rel="stylesheet" href="/css/consent.css">
<!--__OG__-->
<style>
@font-face{font-family:'DM Serif Display';font-style:normal;font-weight:400;font-display:swap;src:url(/fonts/dm-serif-display-latin-400-normal.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+2000-206F,U+20AC,U+2122,U+2212}
@font-face{font-family:'Space Grotesk';font-style:normal;font-weight:300 700;font-display:swap;src:url(/fonts/space-grotesk-latin-wght-normal.woff2) format('woff2-variations');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+2000-206F,U+20AC,U+2122,U+2212}
body{background:#FBF9F5;color:#111;min-height:100vh;overflow-x:hidden;font-family:'Space Grotesk',system-ui,sans-serif}
.rd{max-width:560px;margin:0 auto;padding:28px max(18px,env(safe-area-inset-left,0px)) 44px max(18px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;align-items:center;text-align:center;gap:18px}
.rd img.logo{width:min(100%,480px);height:auto;display:block}
.rd h1{font-family:'DM Serif Display',Georgia,serif;font-weight:400;font-size:clamp(26px,5vw,34px);line-height:1.15;margin:6px 0 0;color:#2A2260;text-wrap:balance}
.rd p.lead{margin:0;font-size:17px;line-height:1.5;color:#3d3860;max-width:44ch}
.rd .caixa{width:100%;text-align:left;background:#fff;border:1px solid #ddd8ea;border-top:4px solid #F08A24;padding:18px 18px 16px}
.rd .rod{font-size:13px;color:#5a5670}
.rd .rod a{color:#3E347E}
.rd .prev{width:100%;text-align:left;background:#fff;border:1px solid #ddd8ea;padding:22px 22px 8px}.rd .prev .kk{font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:#b45f06}.rd .prev h2{font-family:'DM Serif Display',Georgia,serif;font-weight:400;font-size:clamp(24px,5vw,31px);line-height:1.15;margin:6px 0 10px;color:#2A2260;text-wrap:balance}.rd .prev .sub{font-size:17px;color:#3d3860;margin:0 0 14px}.rd .prev p,.rd .prev li{font-size:16.5px;line-height:1.6}.rd .prev h3{font-size:14px;letter-spacing:.1em;text-transform:uppercase;color:#3E347E;margin:22px 0 4px}.rd .prev .fts{font-size:14px;color:#5a5670}.rd .prev .fts a{margin-right:10px;color:#3E347E}.rd .prev .cta{margin:22px -22px 0;padding:18px 22px;background:#3E347E;color:#fff;font-size:16px;line-height:1.5}.rd .prev .cta b{font-size:19px}
.rd .msg{margin:0;padding:12px 14px;background:#EFEBF8;font-size:15px;line-height:1.5}
</style>
</head>
<body>
<main class="rd">
  <a href="/" aria-label="Oficina Política, página inicial"><img class="logo" alt="Radar da Oficina Política" src="/img/radar-cor.svg"></a><p style="margin:6px 0 0"><span style="display:inline-block;padding:3px 8px;border-radius:999px;background:#F28C28;color:#fff;font:700 10px/1.2 system-ui,sans-serif;letter-spacing:.08em;text-transform:uppercase">beta</span></p>
  <!--__MATERIA__-->
  <div class="intro" style="__INTRO__"><h1>As principais notícias do dia, em quatro boletins diários</h1>
  <p class="lead">O Radar reúne e reescreve as notícias de política, economia, regiões e mundo, com as fontes à vista. Para ler, entre ou crie sua conta gratuita.</p></div>
  <div class="caixa" id="conta"><p class="ct-carrega">Carregando…</p></div>
  <p class="rod">Quatro edições por dia: 7h, 11h, 15h e 19h. <a href="/">Voltar à página inicial</a></p>
</main>
<script type="module">
var preview = '__PREVIEW__' === '1'; if (preview) { var it = document.querySelector('.intro'); if (it) it.style.display = 'none'; }
var ativo = '__CONTAS__' === '1', box = document.getElementById('conta');
if (!ativo) {
  box.innerHTML = '<p class="msg">O acesso ao Radar está sendo liberado. Volte em breve.</p>';
} else {
  try {
    var cfg = await import('/js/config.js?v=eceea2b7'), ct = await import('/js/conta.js?v=eceea2b7');
    cfg.CONFIG.conta = Object.assign({}, cfg.CONFIG.conta, { endpoint: '/api/conta.php' });
    // o texto padrão do cadastro cita outros recursos do painel; aqui só vale o Radar
    var limpa = function () { box.querySelectorAll('.ct-erro').forEach(function (p) { if (/pergunta livre/.test(p.textContent)) p.textContent = 'O cadastro não está disponível no momento. Tente novamente em alguns minutos.'; }); box.querySelectorAll('.ct-chamada').forEach(function (p) { var t = p.innerHTML; var n = t.replace(' Presidente, governador e senador continuam abertos a todos.', ''); if (n !== t) p.innerHTML = n; }); };
    new MutationObserver(limpa).observe(box, { childList: true, subtree: true });
    var aj = document.createElement('p'); aj.className = 'msg'; aj.style.marginTop = '14px'; aj.textContent = 'Já se cadastrou no site? Clique em “Esqueci a senha” para ativar seu acesso.'; box.parentNode.insertBefore(aj, box.nextSibling);
    var ck = document.createElement('p'); ck.className = 'msg'; ck.style.cssText = 'margin-top:10px;font-size:12.5px;opacity:.85'; ck.innerHTML = 'Usamos cookies estritamente necessários para manter você conectado. Se você chegou por um link compartilhado, guardamos também, por 30 dias, um cookie que registra quem enviou o link. Detalhes na <a href="/privacidade.html">Política de Privacidade</a>.'; aj.parentNode.insertBefore(ck, aj.nextSibling);
    try { var cs = await import('/js/consentimento.js?v=eceea2b7'); cs.iniciarConsentimento(); } catch (e2) {}
    await ct.carregarConta();
    ct.montarConta(box, function (c) { if (c.logado) location.reload(); }, { alvo: 'o Radar da Oficina Política' });
  } catch (e) {
    box.innerHTML = '<p class="msg">Não foi possível carregar o cadastro agora. Tente novamente em instantes.</p>';
  }
}
</script>
</body>
</html>
