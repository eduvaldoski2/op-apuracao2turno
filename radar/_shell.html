<style>
:root{
  --bg:#FBF9F5; --surface:#FFFFFF; --band:#EFEBF8; --ink:#111111; --ink-soft:#514d6b;
  --brand:#3E347E; --brand-deep:#2A2260; --accent:#F08A24; --accent-ink:#9a520a;
  --line:#ddd8ea; --hdr:#FBF9F5; --hdr-ink:#111111; --on-brand:#FBF9F5; --tile:#3E347E; --scrim:rgba(17,12,40,.55);
  --serif:'DM Serif Display',Georgia,'Times New Roman',serif;
  --sans:'Space Grotesk',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#15122c;--surface:#1f1a44;--band:#251f55;--ink:#F3F0EA;--ink-soft:#bdb8dc;--brand:#b9b0f2;--brand-deep:#0f0c24;--accent-ink:#F5A855;--line:#3a3466;--tile:#2A2260;--on-brand:#15122c;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#15122c;--surface:#1f1a44;--band:#251f55;--ink:#F3F0EA;--ink-soft:#bdb8dc;--brand:#b9b0f2;--brand-deep:#0f0c24;--accent-ink:#F5A855;--line:#3a3466;--tile:#2A2260;--on-brand:#15122c;color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.6;margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--hdr)}
a{color:inherit}
button{font-family:inherit;cursor:pointer}
button:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* Cabeçalho */
html,body{overflow-anchor:none}
.hdr{background:var(--hdr);color:var(--hdr-ink);border-bottom:1px solid #e3ddd0;position:sticky;top:env(safe-area-inset-top,0px);z-index:50;text-align:center}
.hdrin{display:flex;flex-direction:column;align-items:center;gap:6px;padding-block:16px 6px}
.btn-sair{font:700 13px/1 'Space Grotesk',system-ui,sans-serif;color:#3E347E;background:#fff;border:1.5px solid #3E347E;border-radius:999px;padding:7px 14px;cursor:pointer}
.btn-sair:hover{background:#3E347E;color:#fff}
#opmc{position:absolute;top:8px;right:max(12px,env(safe-area-inset-right,0px));z-index:30}
.hdr.compact #opmc{top:50%;transform:translateY(-50%)}
@media(max-width:520px){.hdrin{padding-left:12px;padding-right:76px}#opmc{right:8px}}
.logo{display:block;line-height:0;text-decoration:none;min-width:0;max-width:100%}
.logo img{display:block;width:clamp(290px,60vw,560px);max-width:100%;height:auto;margin:0 auto}
.edicao{font-size:13px;color:#4a4660;padding-bottom:10px;font-weight:500;letter-spacing:.01em}
.edicao b{color:#3E347E;font-weight:700}
.hdr.compact .edicao{display:none}
.voltar{align-self:flex-start;font:600 12px/1 "Space Grotesk",system-ui,sans-serif;letter-spacing:.04em;color:var(--hdr-ink);opacity:.75;text-decoration:none;padding:4px 0}
.voltar:hover{opacity:1;text-decoration:underline}
.hdr.compact .voltar{display:none}
.hdr.compact .logo img{width:clamp(190px,32vw,280px)}
.hdr.compact .hdrin{padding-block:8px 2px}
.nav{border-top:1px solid #e3ddd0;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.nav::-webkit-scrollbar{display:none}
.navin{display:flex;width:max-content;margin:0 auto;padding-inline:max(8px,env(safe-area-inset-left,0px)) max(8px,env(safe-area-inset-right,0px))}
.nav a{display:block;padding:13px 17px 10px;font-weight:700;font-size:14px;letter-spacing:.09em;text-transform:uppercase;text-decoration:none;color:#2A2260;border-bottom:4px solid transparent;white-space:nowrap}
.nav a:hover{background:#f3eee3}
.nav a[aria-current="page"]{border-bottom-color:#F08A24;color:#3E347E}
.nav a small{font:500 11px var(--sans);color:#6a6585;margin-left:6px;letter-spacing:.04em}

/* Seções */
main{padding-block:26px 56px;display:flex;flex-direction:column;gap:44px}
.tab{display:flex;align-items:center;justify-content:space-between;gap:12px;border-top:4px solid var(--brand);padding-top:8px;margin-bottom:14px}
.tab h2{margin:0;font-size:13px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:var(--brand)}
.tab a{font-size:13px;color:var(--ink-soft)}
.upd{margin:12px 0 0;padding:10px 14px;border-left:4px solid #3E347E;background:rgba(62,52,126,.09);font-size:15px;line-height:1.45}.upd b{color:#3E347E}
.kk{display:flex;align-items:center;flex-wrap:wrap;gap:4px 0}.flag{display:inline-block;margin-left:8px;padding:2px 6px;border-radius:3px;font-size:10px;font-weight:700;letter-spacing:.1em;line-height:1.3;vertical-align:1px;text-transform:uppercase}.flag.n{background:#F08A24;color:#2a1f55}.flag.a{background:#3E347E;color:#fff}.arqbar{margin:0 0 18px;padding:10px 14px;border-left:4px solid #F08A24;background:rgba(240,138,36,.12);font-size:14px}.arqlist a{display:block;padding:10px 0;border-bottom:1px solid var(--line,#ddd)}.row4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:22px;border-top:1px solid var(--line);padding-top:18px}
.row4 .hl{font-size:20px}
.filler{justify-content:center;align-items:flex-start;border:1.5px dashed var(--brand);padding:18px;border-radius:4px}
.filler .hl a{color:var(--brand)}
.pg.wide{max-width:1180px}
.list.cols2{display:block}
@media (min-width:900px){.list.cols2{columns:2;column-gap:44px}.list.cols2 .item{break-inside:avoid;border-top:0;border-bottom:1px solid var(--line);padding:18px 0}.list.cols2 .hl{font-size:25px}}
.giro-more{display:none;width:100%;margin-top:10px;padding:11px 14px;border:1.5px solid var(--brand);background:transparent;color:var(--brand);font:700 13.5px/1 inherit;letter-spacing:.06em;text-transform:uppercase;cursor:pointer}
.giro-more:hover{background:var(--brand);color:var(--on-brand)}
@media (min-width:900px){.giro-more.on{display:block}}
@media (max-width:1000px){.row4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:560px){.row4{grid-template-columns:minmax(0,1fr)}}
.kicker{font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--accent-ink)}
.meta{font-size:13px;color:var(--ink-soft)}
.hl{font-family:var(--serif);font-weight:400;line-height:1.12;margin:0;text-wrap:balance}
.hl a{text-decoration:none}
.hl a:hover{text-decoration:underline;text-decoration-color:var(--accent);text-underline-offset:4px;text-decoration-thickness:2px}
.sub{color:var(--ink-soft);margin:6px 0 0;font-size:16px;max-width:64ch}

.top{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:32px;align-items:start}
.lead{display:grid;grid-template-columns:minmax(0,1fr);gap:16px;align-content:start}
.lead .hl{font-size:clamp(32px,4.6vw,52px)}
.lead .sub{font-size:19px}
.tile{background:var(--tile);color:#FBF9F5;padding:18px 20px;display:flex;flex-wrap:wrap;gap:6px 24px;align-items:flex-end}
.tile .n{font-family:var(--serif);font-size:clamp(44px,8vw,76px);line-height:1}
.tile .l{font-size:13px;letter-spacing:.08em;text-transform:uppercase;font-weight:500;max-width:34ch;opacity:.92}
.row3{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:22px;border-top:1px solid var(--line);padding-top:18px}
.row3 .hl{font-size:23px}
.row3 .sub,.ed .sub{font-size:15px}
.item{display:flex;flex-direction:column;gap:6px;min-width:0}
.rail{display:flex;flex-direction:column;gap:22px;min-width:0}
@media (min-width:900px){.rail{align-self:start}.rail .giro-btn{pointer-events:none;cursor:default}.rail .giro-btn .chev{display:none}}
.box{background:var(--band);padding:14px 16px}
.box .tab{border-top-color:var(--accent);margin-bottom:8px}

/* Giro recolhível */
.giro-btn{width:100%;display:flex;align-items:center;justify-content:space-between;gap:12px;border:0;background:transparent;padding:6px 0;color:var(--ink);text-align:left}
.giro-btn h2{margin:0;font-size:13px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:var(--brand)}
.giro-btn span{font-size:13px;color:var(--ink-soft)}
.chev{display:inline-block;width:10px;height:10px;border-right:2.5px solid var(--brand);border-bottom:2.5px solid var(--brand);transform:rotate(45deg);margin-left:10px;transition:transform .2s;position:relative;top:-3px}
[aria-expanded="true"] .chev{transform:rotate(-135deg);top:1px}
.olho{font-size:1.05em;margin-right:2px}.opb{width:20px;height:20px;vertical-align:-5px;margin-right:8px;border-radius:5px}.opb.big{width:38px;height:38px;vertical-align:-6px;margin-right:12px;border-radius:9px}.gsub{margin:-4px 0 14px;color:var(--ink-soft);font-size:15px}.notes li .flag{margin:0 6px 0 2px}.notes{list-style:none;margin:6px 0 0;padding:0}
.notes li{padding:11px 0;border-top:1px solid var(--line);font-size:15px;line-height:1.45}
.notes b{color:var(--brand)}
.nact{display:flex;gap:14px;flex-wrap:wrap;margin-top:6px;font-size:13px}
.nact a,.nact button{color:var(--brand);font-weight:700;background:none;border:0;padding:0;text-decoration:underline;text-underline-offset:3px;font-size:13px}
.nsrc{color:var(--ink-soft);font-size:12.5px}
.ndet{margin:8px 0 0;padding:10px 12px;background:var(--surface);border-left:3px solid var(--accent);font-size:14.5px;line-height:1.55}
.trend{padding:9px 0;border-top:1px solid var(--line);font-size:14.5px;line-height:1.45}
.trend:first-of-type{border-top:0}
.trend b{display:block;color:var(--brand);font-size:15px}

/* Blocos de editoria */
.ed{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:28px;align-items:start}
.ed .main .hl{font-size:clamp(26px,3.4vw,36px)}
.ed.solo{grid-template-columns:minmax(0,1fr)}
.ed .main{display:flex;flex-direction:column;gap:0}
.ed .mainx{padding:16px 0 0;margin-top:16px;border-top:1px solid var(--line)}
.ed .mainx .hl{font-size:22px}
.ed .side{display:flex;flex-direction:column}
.ed .side .item{padding:13px 0;border-top:1px solid var(--line)}
.ed .side .item:first-child{border-top:0;padding-top:0}
.ed .side .hl{font-size:20px}
.mini{display:block;font-size:15px;line-height:1.4;color:var(--ink)}

/* Sub-regiões */
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 14px}
.chips a{padding:7px 14px;border:1.5px solid var(--brand);color:var(--brand);font-weight:700;font-size:13.5px;text-decoration:none;border-radius:999px}
.chips a[aria-current="true"]{background:var(--brand);color:var(--on-brand)}
.subh{display:flex;align-items:baseline;justify-content:space-between;gap:10px;border-top:3px solid var(--accent);padding-top:6px;margin:26px 0 4px}
.subh h2{margin:0;font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--brand)}
.subh a{font-size:13px;color:var(--ink-soft)}
/* Colunas dentro das editorias */
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));gap:18px}
.col{background:var(--surface);border:1px solid var(--line);border-top:4px solid var(--accent);padding:16px 18px;display:flex;flex-direction:column;gap:8px;min-width:0}
.col .au{font-weight:700;color:var(--brand);font-size:15px}
.col .au small{font-weight:500;color:var(--ink-soft);margin-left:6px;font-size:12.5px}
.col h3{font-family:var(--serif);font-weight:400;font-size:21px;line-height:1.18;margin:0;text-wrap:balance}
.col p{margin:0;font-size:14.5px;line-height:1.5;color:var(--ink-soft)}
.col a.go{margin-top:auto;font-size:13px;font-weight:700;color:var(--brand)}

/* Matéria */
.crumb{font-size:13px;color:var(--ink-soft);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.crumb a{color:var(--brand);font-weight:700;text-decoration:none}
.art{width:100%;max-width:780px;margin:0 auto;display:flex;flex-direction:column;gap:16px;min-width:0}
.art h1{font-family:var(--serif);font-weight:400;font-size:clamp(32px,5vw,50px);line-height:1.1;margin:0;text-wrap:balance}
.art .sub{font-size:20px;line-height:1.45}
.modebar{position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--hh,70px));z-index:20;background:var(--bg);border-block:1px solid var(--line);padding-block:10px;display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center}
.seg{display:inline-flex;border:1.5px solid var(--brand)}
.seg button{font-size:14px;font-weight:700;background:transparent;color:var(--brand);border:0;padding:8px 16px}
.seg button+button{border-left:1.5px solid var(--brand)}
.seg button[aria-pressed="true"]{background:var(--brand);color:var(--on-brand)}
.act{display:inline-flex;align-items:center;gap:8px;font-size:14px;font-weight:700;color:var(--brand);background:transparent;border:1.5px solid var(--brand);padding:8px 14px}
.act:hover{background:var(--band)}
.act svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.sp{flex:1}
.body{display:flex;flex-direction:column;gap:16px;font-size:18px;line-height:1.72}
.body p{margin:0}
.body h2{font-family:var(--serif);font-weight:400;font-size:28px;line-height:1.15;margin:14px 0 0;color:var(--brand);text-wrap:balance}
.body ul{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:8px}
.nums{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,170px),1fr));gap:12px}
.nums div{background:var(--band);padding:12px 14px}
.nums b{display:block;font-family:var(--serif);font-weight:400;font-size:32px;line-height:1.05;color:var(--brand)}
.nums span{font-size:13px;color:var(--ink-soft);line-height:1.35;display:block;margin-top:4px}
.tl{list-style:none;margin:0;padding:0;border-left:3px solid var(--accent);display:flex;flex-direction:column;gap:12px}
.tl li{padding-left:16px;display:grid;grid-template-columns:70px minmax(0,1fr);gap:10px;font-size:17px;line-height:1.55}
.tl b{font-variant-numeric:tabular-nums;color:var(--brand)}
.resumo{font-size:19px;line-height:1.7;border-left:4px solid var(--accent);padding-left:16px}
.fontes{border-top:1px solid var(--line);padding-top:14px;font-size:14px;color:var(--ink-soft);line-height:1.9}
.fontes b{font-size:12px;letter-spacing:.12em;text-transform:uppercase;margin-right:10px}
.fontes a,.fontes span.s{margin-right:14px;display:inline-block;max-width:100%;overflow-wrap:anywhere}
.fontes a{color:var(--brand)}
.more{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr));gap:20px;border-top:4px solid var(--brand);padding-top:14px}
.more .hl{font-size:20px}
.list{display:flex;flex-direction:column}
.list .item{padding:18px 0;border-top:1px solid var(--line)}
.list .item:first-child{border-top:0}
.list .hl{font-size:28px}
.pg{width:100%;max-width:820px;margin:0 auto;display:flex;flex-direction:column;gap:10px;min-width:0}
.pg h1{font-family:var(--serif);font-weight:400;font-size:44px;line-height:1.1;margin:0}

/* Janelas (compartilhar, card) */
.modal{position:fixed;inset:0;z-index:90;display:flex;align-items:flex-end;justify-content:center;background:var(--scrim)}
.sheet{background:var(--bg);color:var(--ink);width:100%;max-width:640px;max-height:92vh;overflow-y:auto;padding:18px max(18px,env(safe-area-inset-left,0px)) calc(20px + env(safe-area-inset-bottom,0px));border-top:4px solid var(--accent)}
.sheet.wide{max-width:980px}
.sheet h3{font-family:var(--serif);font-weight:400;font-size:26px;margin:0 0 4px}
.sheet .x{float:right;border:0;background:transparent;font-size:30px;line-height:1;color:var(--brand);width:44px;height:44px;margin:-10px -10px 0 0}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-top:14px}
.mailbox{margin-top:14px;padding:14px;border:1.5px solid var(--line);background:var(--surface)}
.mailbox label{display:block;font-weight:700;font-size:13.5px;margin:8px 0 4px}
.mailbox input[type=email],.mailbox textarea{width:100%;padding:10px 12px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;font-size:15px}
.mailbox textarea{min-height:64px;resize:vertical}
.mailbox .go{margin-top:10px;width:100%;padding:12px;border:0;background:var(--accent);color:#2a1700;font-weight:700;font-size:15px}
.mailbox .go[disabled]{opacity:.6}
.mailbox small{display:block;margin-top:8px;color:var(--ink-soft);font-size:12.5px;line-height:1.4}
.opt{display:flex;align-items:center;justify-content:center;gap:8px;text-align:center;padding:13px 10px;border:1.5px solid var(--brand);color:var(--brand);font-weight:700;font-size:14px;text-decoration:none;background:transparent}
.opt:hover{background:var(--band)}
.opt.wa{background:#1f8a4c;border-color:#1f8a4c;color:#fff}
.sharetxt{margin:12px 0 0;padding:10px 12px;background:var(--band);font-size:14px;line-height:1.5;white-space:pre-wrap;overflow-wrap:anywhere}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:16px;margin-top:14px;align-items:start}
.cardbox{display:flex;flex-direction:column;gap:8px}
.cardbox img{width:100%;height:auto;display:block;border:1px solid var(--line);background:#fff}
.cardbox b{font-size:13px;color:var(--ink-soft);letter-spacing:.04em}
.msg{font-size:13px;color:var(--ink-soft);margin-top:10px}

footer{background:#FBF9F5;color:#111;border-top:4px solid #3E347E;padding-block:26px 34px}
footer .wrap{display:flex;flex-direction:column;gap:10px;align-items:center;text-align:center}
footer img{width:min(100%,190px);height:auto;display:block}

<script>
var LOGO_NEG = '/img/radar-negativo.svg';
var BASE_URL = 'https://oficinapolitica.com.br/radar';
/*__EDICAO__*/

var MODES = [['resumo','Resumo'],['fundo','Aprofundado']];
var mode = 'resumo';
try{var m=localStorage.getItem('radar-modo2'); if(m==='resumo'||m==='fundo') mode=m}catch(e){}
var giroOpen=window.matchMedia&&window.matchMedia('(min-width:900px)').matches;

function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function words(s){return (String(s).match(/\S+/g)||[]).length}
function wordsOf(blocks){var n=0;blocks.forEach(function(b){if(b[0]==='p'||b[0]==='h')n+=words(b[1]);else if(b[0]==='ul')b[1].forEach(function(x){n+=words(x)});else if(b[0]==='tl'||b[0]==='nums')b[1].forEach(function(x){n+=words(x[1])})});return n}
function minutes(id,m){var s=S[id];var n=m==='resumo'?words(s.resumo):wordsOf(s.fundo);return Math.max(1,Math.round(n/190))}
function href(id){return '#materia-'+id}
function edOf(id){return ED.filter(function(e){return e.id===id})[0]}
var shareId='';
function shareUrl(id,canal){
  var q='m='+encodeURIComponent(id)+'&utm_source=radar&utm_medium='+(canal||'link')+'&utm_campaign=compartilhar';
  if(typeof SHARE_REF!=='undefined'&&SHARE_REF) q='r='+SHARE_REF+'&'+q;
  return BASE_URL+'/?'+q+'#materia-'+id;
}
function gaEv(n,pr,ex){try{if(window.__op)window.__op.evento(n,pr||{},ex||{})}catch(e){}}
function edNome(id){var s=S[id];return s?s.ed:''}
function trackShare(canal){gaEv('share',{method:canal,item_id:shareId,content_type:'materia',editoria:edNome(shareId),regiao:(S[shareId]||{}).reg||'',edicao:EDICAO.hora},{meta:'CompartilharMateria',metaCustom:true,metaDados:{canal:canal},ads:'compartilhar'});try{var fd=new FormData();fd.append('m',shareId);fd.append('c',canal);navigator.sendBeacon('/radar/track.php',fd)}catch(e){}}

function flag(id){var f=typeof FLAGS!=='undefined'&&FLAGS[id];return f?'<span class="flag '+(f==='novo'?'n':'a')+'">'+(f==='novo'?'NOVO':'ATUALIZADA')+'</span>':''}
function dadoTile(d){return ''&&d?'<div class="tile"><div class="n">'+esc(d.n)+'</div><div class="l">'+esc(d.l)+'</div></div>':''}
function item(id,big){var s=S[id];return '<div class="item"><div class="kk"><span class="kicker">'+esc(s.k)+'</span>'+flag(id)+'</div><h3 class="hl" style="font-size:'+(big?'clamp(26px,3.4vw,36px)':'21px')+'"><a href="'+href(id)+'">'+esc(s.t)+'</a></h3><p class="sub">'+esc(s.sub)+'</p></div>'}
function srcLink(f){return f[1]?'<a href="'+esc(f[1])+'" target="_blank" rel="noopener">'+esc(f[0])+'</a>':'<span class="s">'+esc(f[0])+'</span>'}

function giroItems(){
  return GIRO.map(function(g,i){
    var acts='';
    if(g[4]) acts+='<button type="button" data-det="'+i+'">Mais detalhes</button>';
    if(g[5]) acts+='<a href="'+href(g[5])+'">Ler a matéria</a>';
    else if(g[3]) acts+='<a href="'+esc(g[3])+'" target="_blank" rel="noopener">Ler na fonte ↗</a>';
    var gf=typeof GIRO_FLAGS!=='undefined'&&GIRO_FLAGS[g[0]];
    var gt=gf?'<span class="flag '+(gf==='novo'?'n':'a')+'">'+(gf==='novo'?'NOVA':'ATUALIZADA')+'</span>':'';
    return '<li><b>'+esc(g[0])+'.</b>'+gt+' '+esc(g[1])+'<div class="nact">'+acts+'<span class="nsrc">'+esc(g[2])+'</span></div><div class="ndet" id="det'+i+'" hidden>'+esc(g[4])+'</div></li>';
  }).join('');
}
function giroBox(){
  return '<div class="box"><button type="button" class="giro-btn" id="giroBtn" aria-expanded="'+giroOpen+'" aria-controls="giroList"><h2><img class="opb" src="/img/op-giro.svg" alt="">Giro OP</h2><span>'+GIRO.length+' notas<i class="chev"></i></span></button><ul class="notes" id="giroList"'+(giroOpen?'':' hidden')+'>'+giroItems()+'</ul><button type="button" class="giro-more" id="giroMore"></button></div>';
}
var trendsOpen=false;
function trendLink(t){
  if(t[2]) return '<a href="'+esc(t[2])+'" target="_blank" rel="noopener">Ler na fonte ↗</a>';
  if(t[3]&&S[t[3]]) return '<a href="'+href(t[3])+'">Ler a matéria</a>';
  return '';
}
function trendsBox(){
  var L=TRENDS.filter(function(t){return trendLink(t)});
  if(!L.length) return '';
  return '<div class="box"><button type="button" class="giro-btn" id="trBtn" aria-expanded="'+trendsOpen+'" aria-controls="trList"><h2>Em debate nas redes</h2><span>'+L.length+(L.length>1?' temas':' tema')+'<i class="chev"></i></span></button><div id="trList"'+(trendsOpen?'':' hidden')+'>'+L.map(function(t){return '<div class="trend"><b>'+esc(t[0])+'</b>'+esc(t[1])+'<div class="nact">'+trendLink(t)+'</div></div>'}).join('')+'</div></div>';
}
function colCards(list){
  return '<div class="cols">'+list.map(function(c){
    var go=c[4]?'<a class="go" href="'+esc(c[4])+'" target="_blank" rel="noopener">Ler a coluna ↗</a>':(c[5]&&S[c[5]]?'<a class="go" href="'+href(c[5])+'">Ver a matéria relacionada</a>':'');
    return '<div class="col"><div class="au">'+esc(c[0])+'<small>'+esc(c[1])+'</small></div><h3>'+esc(c[2])+'</h3><p>'+esc(c[3])+'</p>'+go+'</div>';
  }).join('')+'</div>';
}
function colsFor(eid){
  var L=COLUNAS.filter(function(c){return c[6]===eid&&(c[4]||(c[5]&&S[c[5]]))});
  return L.length?'<div class="subh"><h2>Colunas e análises</h2></div>'+colCards(L):'';
}
function idsOf(eid,sub){return ORDER[eid].filter(function(id){return !sub||S[id].reg===sub})}
function briefRow(b){return '<div class="item"><a class="mini" href="'+esc(b[1])+'" target="_blank" rel="noopener">'+esc(b[0])+'</a><span class="meta">'+esc(b[2])+'</span></div>'}

var AM_TIPOS={congresso:'Congresso',agenda:'Agenda',economia:'Economia',justica:'Justiça',eleicao:'Eleição',mundo:'Mundo'};
function amanhaBox(){
  if(typeof AMANHA==='undefined'||!AMANHA.length) return '';
  return '<section class="amanha"><div class="tab"><h2><span class="olho" aria-hidden="true">👀</span> Para ficar de olho</h2></div><div class="amanha-g">'+AMANHA.map(function(a){
    var go=a[4]?'<a class="go" href="'+esc(a[4])+'" target="_blank" rel="noopener">Saiba mais ↗</a>':(a[5]&&S[a[5]]?'<a class="go" href="'+href(a[5])+'">Ver a matéria</a>':'');
    return '<div class="am"><span class="q">'+esc(a[0])+'<i>'+esc(AM_TIPOS[a[1]]||'')+'</i></span><h3>'+esc(a[2])+'</h3><p>'+esc(a[3])+'</p>'+go+'</div>';
  }).join('')+'</div></section>';
}
function homeView(){
  var L=S[HOME_LEAD];
  var more=(ORDER.politica||[]).filter(function(id){return id!==HOME_LEAD&&HOME_ROW.indexOf(id)<0}).slice(0,6);
  var h='<div class="top"><div class="lead"><div class="kk"><span class="kicker">'+esc(L.k)+'</span>'+flag(HOME_LEAD)+'</div><h1 class="hl"><a href="'+href(HOME_LEAD)+'">'+esc(L.t)+'</a></h1><p class="sub">'+esc(L.sub)+'</p>'+dadoTile(L.dado)+'<div class="row3">'+HOME_ROW.map(function(id){return item(id)}).join('')+'</div>'+(more.length?'<div class="row3 more">'+more.map(function(id){return item(id)}).join('')+'</div>':'')+'</div>';
  h+='<aside class="rail">'+giroBox()+trendsBox()+'</aside></div>';
  var used=[HOME_LEAD].concat(HOME_ROW).concat(more);
  ED.forEach(function(e){
    if(e.subs){
      h+='<section><div class="tab"><h2>'+esc(e.nome)+'</h2><a href="#editoria-'+e.id+'">Todas de '+esc(e.nome)+'</a></div><div class="chips">'+e.subs.map(function(s){return '<a href="#regiao-'+s[0]+'">'+esc(s[1])+'</a>'}).join('')+'</div><div class="row4">';
      e.subs.forEach(function(s){var ids=idsOf(e.id,s[0]);if(!ids.length)return;var id=ids[0];h+='<div class="item"><div class="kk"><span class="kicker">'+esc(s[1])+(ids.length>1?' · +'+(ids.length-1):'')+'</span>'+flag(id)+'</div><h3 class="hl" style="font-size:21px"><a href="'+href(id)+'">'+esc(S[id].t)+'</a></h3><p class="sub">'+esc(S[id].sub)+'</p></div>'});
      h+='<div class="item filler"><span class="kicker">Todas as regiões</span><h3 class="hl"><a href="#editoria-regioes">Veja as matérias de cada região →</a></h3></div></div>'+colsFor(e.id)+'</section>';
      return;
    }
    var ids=ORDER[e.id].filter(function(x){return used.indexOf(x)<0});
    var br=(BRIEFS[e.id]||[]);
    if(!ids.length&&!br.length) return;
    h+='<section><div class="tab"><h2>'+esc(e.nome)+'</h2><a href="#editoria-'+e.id+'">Todas de '+esc(e.nome)+'</a></div>';
    if(ids.length){
      var nl=ids.length>4?3:1;
      h+='<div class="ed'+(ids.length<=nl&&!br.length?' solo':'')+'"><div class="main">'+item(ids[0],true)+ids.slice(1,nl).map(function(id){return '<div class="mainx">'+item(id)+'</div>'}).join('')+'</div><div class="side">';
      ids.slice(nl).forEach(function(id){h+=item(id)});
      br.forEach(function(b){h+=briefRow(b)});
      h+='</div></div>';
    } else {
      h+='<div class="list">'+br.map(briefRow).join('')+'</div>';
    }
    h+=colsFor(e.id)+'</section>';
  });
  return h+amanhaBox();
}

function actionsBar(id){
  return '<div class="modebar"><div class="seg" role="group" aria-label="Modo de leitura">'+MODES.map(function(m){return '<button type="button" data-m="'+m[0]+'" aria-pressed="'+(m[0]===mode)+'">'+m[1]+'</button>'}).join('')+'</div><span class="meta" id="mins"></span><span class="sp"></span>'
   +'<button type="button" class="act" data-share="'+id+'"><svg viewBox="0 0 24 24"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="M8.6 10.5l6.8-4M8.6 13.5l6.8 4"/></svg><span class="t">Compartilhar</span></button>'
   +'<button type="button" class="act" data-card="'+id+'"><svg viewBox="0 0 24 24"><path d="M12 3v12M7 11l5 5 5-5M5 21h14"/></svg><span class="t">Baixar card</span></button></div>';
}
function articleBody(id){
  var s=S[id];
  if(mode==='resumo') return '<p class="resumo">'+esc(s.resumo)+'</p>';
  return renderBlocks(s.fundo);
}
function renderBlocks(blocks){
  return blocks.map(function(b){
    switch(b[0]){
      case 'h': return '<h2>'+esc(b[1])+'</h2>';
      case 'p': return '<p>'+esc(b[1])+'</p>';
      case 'ul': return '<ul>'+b[1].map(function(x){return '<li>'+esc(x)+'</li>'}).join('')+'</ul>';
      case 'tl': return '<ol class="tl">'+b[1].map(function(x){return '<li><b>'+esc(x[0])+'</b><span>'+esc(x[1])+'</span></li>'}).join('')+'</ol>';
      case 'nums': return '<div class="nums">'+b[1].map(function(x){return '<div><b>'+esc(x[0])+'</b><span>'+esc(x[1])+'</span></div>'}).join('')+'</div>';
    }
    return '';
  }).join('');
}
function articleView(id){
  var s=S[id], ed=edOf(s.ed);
  var more=ORDER[s.ed].filter(function(x){return x!==id&&(!s.reg||S[x].reg===s.reg)}).concat(ORDER[s.ed].filter(function(x){return x!==id&&s.reg&&S[x].reg!==s.reg})).concat(Object.keys(S).filter(function(x){return x!==id&&S[x].ed!==s.ed})).slice(0,3);
  return '<article class="art"><div class="crumb"><a href="#">Radar</a> / <a href="#editoria-'+ed.id+'">'+esc(ed.nome)+'</a>'+(s.reg?' / <a href="#regiao-'+s.reg+'">'+esc(s.k.replace(/^[^·]*·\s*/,''))+'</a>':'')+'</div>'
   +'<h1>'+esc(s.t)+flag(id)+'</h1><p class="sub">'+esc(s.sub)+'</p>'
   +'<div class="meta">Edição das '+esc(EDICAO.hora)+' · '+esc(EDICAO.data)+' · com base em '+s.fontes.length+' fonte'+(s.fontes.length>1?'s':'')+'</div>'
   +(typeof FLAGS!=='undefined'&&FLAGS[id]==='atualizada'&&s.upd?'<div class="upd"><b>Atualizada.</b> '+esc(s.upd)+'</div>':'')
   +actionsBar(id)+'<div class="body" id="abody">'+articleBody(id)+'</div>'
   +'<div class="fontes"><b>Fontes</b>'+s.fontes.map(srcLink).join('')+'</div>'
   +'<div class="more">'+more.map(function(x){return item(x)}).join('')+'</div></article>';
}
function storyRow(id){return '<div class="item"><div class="kk"><span class="kicker">'+esc(S[id].k)+' · '+esc(S[id].hora)+'</span>'+flag(id)+'</div><h2 class="hl"><a href="'+href(id)+'">'+esc(S[id].t)+'</a></h2><p class="sub">'+esc(S[id].sub)+'</p></div>'}
function edView(eid,sub){
  var e=edOf(eid); if(!e) return homeView();
  var subName=''; if(e.subs&&sub){e.subs.forEach(function(s){if(s[0]===sub)subName=s[1]})}
  var h='<div class="pg wide"><div class="crumb"><a href="#">Radar</a> / '+(subName?'<a href="#editoria-'+e.id+'">'+esc(e.nome)+'</a> / '+esc(subName):esc(e.nome))+'</div><h1>'+esc(subName||e.nome)+'</h1>';
  if(e.subs){
    h+='<div class="chips"><a href="#editoria-'+e.id+'"'+(!subName?' aria-current="true"':'')+'>Todas</a>'+e.subs.map(function(s){return '<a href="#regiao-'+s[0]+'"'+(s[0]===sub?' aria-current="true"':'')+'>'+esc(s[1])+'</a>'}).join('')+'</div>';
    if(subName){h+='<div class="list cols2">'+idsOf(eid,sub).map(storyRow).join('')+'</div>'}
    else e.subs.forEach(function(s){var ids=idsOf(eid,s[0]);if(!ids.length)return;h+='<div class="subh"><h2>'+esc(s[1])+'</h2><a href="#regiao-'+s[0]+'">Ver '+(ids.length>1?'as '+ids.length+' matérias':'a matéria')+'</a></div><div class="list cols2">'+ids.map(storyRow).join('')+'</div>'});
  } else {
    h+='<div class="list cols2">'+ORDER[eid].map(storyRow).join('')+(BRIEFS[eid]||[]).map(briefRow).join('')+'</div>';
  }
  return h+colsFor(eid)+'</div>';
}
function arquivoView(){
  var L=(typeof ARQUIVO!=='undefined'&&ARQUIVO)||[],dias={},ord=[];
  L.forEach(function(n,i){var d=n.slice(0,10);if(!dias[d]){dias[d]=[];ord.push(d)}dias[d].push([n,i===0])});
  var M=['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
  return '<div class="pg"><div class="crumb"><a href="#">Radar</a> / Arquivo</div><h1>Arquivo de edições</h1><p class="sub">Todas as edições publicadas, no estado em que saíram. As etiquetas NOVO e ATUALIZADA mostram o que mudou em relação à edição anterior.</p>'
   +(ord.length?ord.map(function(d){var p=d.split('-');return '<div class="subh"><h2>'+parseInt(p[2],10)+' de '+M[parseInt(p[1],10)-1]+' de '+p[0]+'</h2></div><div class="arqlist">'+dias[d].map(function(x){return '<a href="/radar/'+(x[1]?'':'?ed='+x[0])+'">Edição das '+x[0].slice(11)+(x[1]?' · atual':'')+'</a>'}).join('')+'</div>'}).join(''):'<p>Ainda não há edições arquivadas.</p>')+'</div>';
}
function giroView(){
  return '<div class="pg"><div class="crumb"><a href="#">Radar</a> / Giro OP</div><h1 class="gh"><img class="opb big" src="/img/op-giro.svg" alt="">Giro OP</h1><p class="gsub">Notas rápidas do que se move na política, com a fonte à vista.</p><ul class="notes">'+giroItems()+'</ul></div>';
}

/* Menu horizontal */
function menuHtml(cur){
  var items=[['','Capa','']].concat(ED.map(function(e){return ['editoria-'+e.id,e.nome,'']})).concat([['giro','Giro OP',''],['arquivo','Arquivo',''],['boletim','Boletim','']]);
  return '<div class="navin">'+items.map(function(i){return '<a href="#'+i[0]+'"'+(i[0]===cur?' aria-current="page"':'')+'>'+esc(i[1])+'</a>'}).join('')+'</div>';
}

/* Rota */
function updateMins(id){var el=document.getElementById('mins'); if(el) el.textContent='Leitura de cerca de '+minutes(id,mode)+' min'}
function route(){
  var h=location.hash.replace(/^#/,''), app=document.getElementById('app'), cur=h;
  closeModal();
  if(h.indexOf('materia-')===0 && S[h.slice(8)]){var id=h.slice(8);app.innerHTML=articleView(id);updateMins(id);cur='editoria-'+S[id].ed}
  else if(h==='giro'){app.innerHTML=giroView()}
  else if(h==='arquivo'){app.innerHTML=arquivoView()}
  else if(h==='boletim'){location.replace('/conta.html#preferencias')}
  else if(h.indexOf('regiao-')===0){app.innerHTML=edView('regioes',h.slice(7));cur='editoria-regioes'}
  else if(h.indexOf('editoria-')===0 && edOf(h.slice(9))){app.innerHTML=edView(h.slice(9))}
  else {app.innerHTML=homeView();cur=''}
  document.getElementById('nav').innerHTML=menuHtml(cur);
  window.scrollTo(0,0);
  sizeHdr();
  layoutFix();
  try{var mm=location.hash.match(/^#materia-(.+)$/);document.title=(mm&&S[mm[1]]?S[mm[1]].t+' · ':'')+'Radar da Oficina Política';if(window.__op)window.__op.rastrearTela('/radar/'+location.hash,document.title);if(mm&&S[mm[1]])lerMateria(mm[1])}catch(e){}
}
var lidaId='';
function lerMateria(id){
  if(lidaId===id)return;lidaId=id;var s=S[id];if(!window.__op)return;
  gaEv('ler_materia',{item_id:id,editoria:s.ed,regiao:s.reg||'',edicao:EDICAO.hora,tipo_flag:(typeof FLAGS!=='undefined'&&FLAGS[id])||'normal'},{meta:'ViewContent',metaDados:{content_ids:[id],content_category:s.ed},ads:'leitura'});
  try{if(window.__op.perfilOk()){var fd=new FormData();fd.append('t','leitura');fd.append('m',id);fd.append('e',s.ed);fd.append('g',s.reg||'');fd.append('p','1');navigator.sendBeacon('/radar/track.php',fd)}}catch(e){}
}
/* Ajustes de layout no desktop: Giro com altura da coluna da capa e editorias equilibradas */
var giroAll=false;
function isDesk(){return window.matchMedia&&window.matchMedia('(min-width:900px)').matches}
function fitGiro(){
  var ul=document.getElementById('giroList'),btn=document.getElementById('giroMore'),lead=document.querySelector('.top .lead');

async function saveBlob(blob,filename,msgEl){
